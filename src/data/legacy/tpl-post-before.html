<div id="content-wrap" class="container clr">

		
		<div id="primary" class="content-area clr">

			
			<div id="content" class="site-content clr">

				
				
<article id="post-{{ID}}">

	
<div class="thumbnail">

	<img fetchpriority="high" width="2000" height="1500" src="/wp-content/uploads/2026/09/img_1972-1.jpeg" class="attachment-full size-full wp-post-image" alt="You are currently viewing {{TITLE}}" itemprop="image" decoding="async" />
</div><!-- .thumbnail -->


<header class="entry-header clr">
	<h2 class="single-post-title entry-title" itemprop="headline">{{TITLE}}</h2><!-- .single-post-title -->
</header><!-- .entry-header -->


<ul class="meta ospm-default clr">

	
					<li class="meta-author" itemprop="name"><span class="screen-reader-text">投稿者:</span><i class=" icon-user" aria-hidden="true" role="img"></i><a href="/blog/" rel="author"  itemprop="author" itemscope="itemscope" itemtype="https://schema.org/Person">DivingSHOP-ABARO</a></li>
		
		
		
		
		
		
	
		
					<li class="meta-date" itemprop="datePublished"><span class="screen-reader-text">投稿公開日:</span><i class=" icon-clock" aria-hidden="true" role="img"></i>{{DATE}}</li>
		
		
		
		
		
	
		
		
		
					<li class="meta-cat"><span class="screen-reader-text">投稿カテゴリー:</span><i class=" icon-folder" aria-hidden="true" role="img"></i><a href="{{CATURL}}" rel="category tag">{{CATNAME}}</a></li>
		
		
		
	
		
		
		
		
		
		
	
</ul>
